[workspace]
resolver = "2"
members = [
    "api-core",
    "api-entity", "api-gateway", "api-iam",
    "api-lib",
    "api-middleware", 
    "api-migration",
]

[workspace.dependencies]
tokio = { version = "1.45.1", features = ["full"] }
axum = { version = "0.8", features = [ "multipart" ] }
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-native-tls", "postgres", "chrono", "json", "derive", "uuid", "macros", "migrate" ] }
tower = { version = "0.5", features = [ "retry", "layer", "util" ] }
tower-http = { version = "0.6", features = [ "trace", "cors" ] }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
